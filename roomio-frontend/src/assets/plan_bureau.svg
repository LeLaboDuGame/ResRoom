<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" fill="none" stroke="#424b54" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <title>Plan Bureau - Walls Only</title>

  <!-- ================================================================ -->
  <!--  BUILDING OUTER SHELL                                            -->
  <!--                                                                  -->
  <!--  Shape: Top horizontal bar + right arrow tip + two diagonal      -->
  <!--  wings going down-left and down-right from the center            -->
  <!--                                                                  -->
  <!--  Layout reference from original:                                 -->
  <!--  - Top wing: y=70 to y=155, x=55 to x=1030                      -->
  <!--  - Right arrow: y=140 to y=280, x=1030 to x=1440                -->
  <!--  - Left diagonal wing: from ~(155,240) down to ~(310,530)        -->
  <!--  - Right diagonal wing: from ~(870,310) down to ~(650,660)       -->
  <!--  - Bottom V: both wings meet at Accueil ~(540,690)               -->
  <!-- ================================================================ -->

  <!-- OUTER WALLS - single continuous path -->
  <path d="
    M 55,70
    L 1030,70
    L 1030,140
    L 1340,140
    L 1440,210
    L 1340,280
    L 1030,280
    L 1030,310
    L 870,310
    L 690,505
    L 640,565
    L 610,600
    L 590,625
    L 570,650
    L 540,690
    L 510,650
    L 480,610
    L 450,570
    L 410,525
    L 360,470
    L 310,410
    L 245,340
    L 200,290
    L 155,240
    L 55,155
    Z
  " stroke="#424b54" stroke-width="4" fill="none"/>

  <!-- ================================================================ -->
  <!--  C.E ROOM (top-left enclosed office)                             -->
  <!-- ================================================================ -->
  <rect x="55" y="70" width="100" height="85" fill="none" stroke="#424b54" stroke-width="3"/>

  <!-- ================================================================ -->
  <!--  FABLAB (left side, between main wing and diagonal)              -->
  <!-- ================================================================ -->
  <line x1="55" y1="200" x2="155" y2="200" stroke="#424b54" stroke-width="3"/>
  <line x1="155" y1="155" x2="155" y2="240" stroke="#424b54" stroke-width="3"/>

  <!-- ================================================================ -->
  <!--  TOP WING - horizontal divider                                   -->
  <!--  Separates top offices row from open area below                  -->
  <!-- ================================================================ -->
  <line x1="155" y1="155" x2="1030" y2="155" stroke="#424b54" stroke-width="2.5"/>

  <!-- ================================================================ -->
  <!--  TOP OFFICES - vertical partition walls                          -->
  <!-- ================================================================ -->
  <line x1="230" y1="70" x2="230" y2="155" stroke="#424b54" stroke-width="2"/>
  <line x1="330" y1="70" x2="330" y2="155" stroke="#424b54" stroke-width="2"/>
  <line x1="430" y1="70" x2="430" y2="155" stroke="#424b54" stroke-width="2"/>
  <line x1="540" y1="70" x2="540" y2="155" stroke="#424b54" stroke-width="2"/>
  <line x1="640" y1="70" x2="640" y2="155" stroke="#424b54" stroke-width="2"/>
  <line x1="710" y1="70" x2="710" y2="155" stroke="#424b54" stroke-width="2"/>
  <line x1="790" y1="70" x2="790" y2="155" stroke="#424b54" stroke-width="2"/>
  <line x1="870" y1="70" x2="870" y2="155" stroke="#424b54" stroke-width="2"/>
  <line x1="950" y1="70" x2="950" y2="155" stroke="#424b54" stroke-width="2"/>

  <!-- ================================================================ -->
  <!--  WC BLOCK (WC Hommes top, WC Femmes bottom)                      -->
  <!-- ================================================================ -->
  <rect x="540" y="155" width="170" height="155" fill="none" stroke="#424b54" stroke-width="2.5"/>
  <line x1="540" y1="235" x2="710" y2="235" stroke="#424b54" stroke-width="2"/>

  <!-- ================================================================ -->
  <!--  OPEN SPACE vertical partitions (below top offices, left side)   -->
  <!-- ================================================================ -->
  <line x1="260" y1="155" x2="260" y2="310" stroke="#424b54" stroke-width="1.5"/>
  <line x1="360" y1="155" x2="360" y2="310" stroke="#424b54" stroke-width="1.5"/>
  <line x1="460" y1="155" x2="460" y2="310" stroke="#424b54" stroke-width="1.5"/>

  <!-- ================================================================ -->
  <!--  ARCHI ROOM                                                      -->
  <!-- ================================================================ -->
  <rect x="760" y="170" width="110" height="140" fill="none" stroke="#424b54" stroke-width="2.5"/>

  <!-- ================================================================ -->
  <!--  B1 + B2 ROOMS                                                   -->
  <!-- ================================================================ -->
  <rect x="870" y="155" width="160" height="125" fill="none" stroke="#424b54" stroke-width="2.5"/>
  <line x1="950" y1="155" x2="950" y2="280" stroke="#424b54" stroke-width="2"/>

  <!-- ================================================================ -->
  <!--  RIGHT ARROW WING internal partitions                            -->
  <!-- ================================================================ -->
  <line x1="1130" y1="140" x2="1130" y2="280" stroke="#424b54" stroke-width="2"/>
  <line x1="1230" y1="140" x2="1230" y2="280" stroke="#424b54" stroke-width="2"/>
  <line x1="1030" y1="210" x2="1340" y2="210" stroke="#424b54" stroke-width="2"/>

  <!-- ================================================================ -->
  <!--  SALLE S2 (meeting room, mid-level)                              -->
  <!-- ================================================================ -->
  <rect x="400" y="275" width="100" height="70" fill="none" stroke="#424b54" stroke-width="2.5"/>

  <!-- ================================================================ -->
  <!--  RÉFECTOIRE / CAFÉTÉRIA (lower-left diagonal wing)               -->
  <!--  Enclosed room along the left diagonal wall                      -->
  <!-- ================================================================ -->
  <path d="
    M 155,280
    L 370,280
    L 370,370
    L 310,410
    L 245,340
    L 200,290
    L 155,280
    Z
  " fill="none" stroke="#424b54" stroke-width="2.5"/>

  <!-- ================================================================ -->
  <!--  CORRIDOR - horizontal wall connecting the two diagonals         -->
  <!-- ================================================================ -->
  <line x1="370" y1="370" x2="540" y2="370" stroke="#424b54" stroke-width="2"/>
  <line x1="710" y1="310" x2="870" y2="310" stroke="#424b54" stroke-width="2"/>
  <line x1="710" y1="370" x2="780" y2="370" stroke="#424b54" stroke-width="2"/>

  <!-- Vertical corridor walls -->
  <line x1="540" y1="310" x2="540" y2="430" stroke="#424b54" stroke-width="2"/>
  <line x1="710" y1="310" x2="710" y2="430" stroke="#424b54" stroke-width="2"/>

  <!-- ================================================================ -->
  <!--  SERVEURS room                                                   -->
  <!-- ================================================================ -->
  <rect x="490" y="430" width="60" height="70" fill="none" stroke="#424b54" stroke-width="2.5"/>

  <!-- ================================================================ -->
  <!--  INFO room (next to Serveurs)                                    -->
  <!-- ================================================================ -->
  <rect x="550" y="430" width="60" height="70" fill="none" stroke="#424b54" stroke-width="2.5"/>

  <!-- ================================================================ -->
  <!--  SALLE S1 (meeting room, right side lower)                       -->
  <!-- ================================================================ -->
  <rect x="630" y="410" width="110" height="90" fill="none" stroke="#424b54" stroke-width="2.5"/>

  <!-- ================================================================ -->
  <!--  ACCUEIL (reception, bottom center of V)                         -->
  <!-- ================================================================ -->
  <rect x="480" y="530" width="130" height="80" fill="none" stroke="#424b54" stroke-width="2.5"/>
</svg>
